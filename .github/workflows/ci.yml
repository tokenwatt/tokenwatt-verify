name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04      # ubuntu-latest (26.04) has no Python 3.9 build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: tokenwatt-verify --version
      - run: tokenwatt-verify conform --help
