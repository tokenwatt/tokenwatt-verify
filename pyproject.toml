[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenwatt-verify"
version = "0.2.0"
description = "Check that an LLM API endpoint serves the model it names, honours the parameters it accepts and bills what it serves: conformance readings (identity, behaviour, billing, service) with hashed evidence, and request-by-request comparison against the genuine model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "TokenWatt", email = "hello@tokenwatt.io" }]
keywords = ["llm", "api", "verification", "conformance", "claude", "openai", "reseller", "proxy", "model substitution", "tokenizer", "billing", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: System :: Benchmark",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []          # standard library only

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://www.tokenwatt.io"
Methodology = "https://www.tokenwatt.io/methodology.html"
Repository = "https://github.com/tokenwatt/tokenwatt-verify"
Issues = "https://github.com/tokenwatt/tokenwatt-verify/issues"

[project.scripts]
tokenwatt-verify = "tokenwatt_verify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenwatt_verify"]
