[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenwatt-verify"
version = "0.1.0"
description = "Check that an LLM API endpoint (a reseller or relay) serves the model it claims, request by request: capability, tokenizer, refusal and latency fingerprints against the genuine model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "TokenWatt", email = "hello@tokenwatt.io" }]
keywords = ["llm", "api", "verification", "claude", "openai", "reseller", "proxy", "model substitution", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: System :: Benchmark",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []          # standard library only

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://www.tokenwatt.io"
Methodology = "https://www.tokenwatt.io/methodology.html"

[project.scripts]
tokenwatt-verify = "tokenwatt_verify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenwatt_verify"]
